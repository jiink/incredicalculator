<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incredicalculator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0b0b12;
        overflow: hidden;
      }
      .info-menu {
        position: fixed;
        top: 4px;
        left: 6px;
        display: flex;
        align-items: flex-start;
        gap: 6px;
        color: rgba(255, 255, 255, 0.6);
      }
      .info-toggle {
        padding: 0 4px;
        border: none;
        border-radius: 4px;
        background: none;
        color: inherit;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }
      .info-toggle:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .info-panel {
        font-size: 13px;
        line-height: 1.4;
        pointer-events: none;
      }
      #frame-counter {
        font: 12px monospace;
      }
      /* Scaled up by script on touch devices to fill the screen */
      .calculator-shell {
        transform: scale(var(--shell-scale, 1));
        transform-origin: center;
      }
      .calculator-shell {
        position: relative;
        width: 286px;
        height: 430px;
        padding: 0;
        background: rgba(209, 208, 208, 0.72);
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      }
      .display-slot {
        position: absolute;
        left: 34px;
        top: 20px;
        width: 160px;
        height: 120px;
        display: grid;
        place-items: center;
        background: #000;
        border-radius: 0;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 160px;
        height: 120px;
        image-rendering: auto;
        background: black;
      }
      .virtual-keypad {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .virtual-key {
        position: absolute;
        width: 64px;
        height: 64px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.92);
        background: rgba(0, 0, 0, 1.0);
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        user-select: none;
        touch-action: none;
        padding: 0;
      }
      .virtual-key .main-label,
      .virtual-key .shift-label,
      .virtual-key .super-label {
        position: absolute;
        line-height: 1;
        pointer-events: none;
      }
      .virtual-key .main-label {
        left: 8px;
        top: 8px;
        font-size: 1.5rem;
        color: #ffffff;
      }
      .virtual-key .shift-label {
        right: 7px;
        top: 8px;
        font-size: 0.75rem;
        color: #5b93fc;
      }
      .virtual-key .super-label {
        left: 7px;
        bottom: 8px;
        font-size: 0.7rem;
        color: #f18f3f;
      }
      .virtual-key:active,
      .virtual-key.pressed {
        background: rgba(111, 180, 255, 0.6);
        border-color: rgba(160, 210, 255, 0.9);
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div class="info-menu">
      <button class="info-toggle" aria-label="Show info" aria-expanded="false" aria-controls="info-panel">⋯</button>
      <div class="info-panel" id="info-panel" hidden>
        <div>Incredicalculator web simulator</div>
        <div id="frame-counter">frames: 0</div>
      </div>
    </div>
    <div class="calculator-shell">
      <div class="display-slot">
        <canvas id="incredicalculator" width="320" height="240"></canvas>
      </div>

      <div class="virtual-keypad" aria-label="Calculator keypad">
        <button class="virtual-key" data-code="Backspace" style="left: 214px; top: 9px;"><span class="main-label">⌫</span><span class="shift-label">&amp;</span><span class="super-label">F1</span></button>
        <button class="virtual-key" data-code="Slash" style="left: 214px; top: 78px;"><span class="main-label">/</span><span class="shift-label">|</span><span class="super-label">F2</span></button>

        <button class="virtual-key" data-code="Digit7" style="left: 7px; top: 147px;"><span class="main-label">7</span><span class="shift-label">(</span><span class="super-label">Hm</span></button>
        <button class="virtual-key" data-code="Digit8" style="left: 76px; top: 147px;"><span class="main-label">8</span><span class="shift-label">)</span><span class="super-label">^</span></button>
        <button class="virtual-key" data-code="Digit9" style="left: 145px; top: 147px;"><span class="main-label">9</span><span class="shift-label">0x</span><span class="super-label">Clr</span></button>
        <button class="virtual-key" data-code="NumpadMultiply" style="left: 214px; top: 147px;"><span class="main-label">*</span><span class="shift-label">%</span><span class="super-label">F3</span></button>

        <button class="virtual-key" data-code="Digit4" style="left: 7px; top: 216px;"><span class="main-label">4</span><span class="shift-label">E</span><span class="super-label">&lt;</span></button>
        <button class="virtual-key" data-code="Digit5" style="left: 76px; top: 216px;"><span class="main-label">5</span><span class="shift-label">F</span><span class="super-label">✔️</span></button>
        <button class="virtual-key" data-code="Digit6" style="left: 145px; top: 216px;"><span class="main-label">6</span><span class="shift-label">~</span><span class="super-label">&gt;</span></button>
        <button class="virtual-key" data-code="Minus" style="left: 214px; top: 216px;"><span class="main-label">-</span><span class="shift-label">&lt;&lt;</span><span class="super-label">F4</span></button>

        <button class="virtual-key" data-code="Digit1" style="left: 7px; top: 285px;"><span class="main-label">1</span><span class="shift-label">B</span><span class="super-label">End</span></button>
        <button class="virtual-key" data-code="Digit2" style="left: 76px; top: 285px;"><span class="main-label">2</span><span class="shift-label">C</span><span class="super-label">v</span></button>
        <button class="virtual-key" data-code="Digit3" style="left: 145px; top: 285px;"><span class="main-label">3</span><span class="shift-label">D</span><span class="super-label">↩</span></button>
        <button class="virtual-key" data-code="NumpadAdd" style="left: 214px; top: 285px;"><span class="main-label">+</span><span class="shift-label">&gt;&gt;</span><span class="super-label">🔊</span></button>

        <button class="virtual-key" data-code="Digit0" style="left: 7px; top: 354px;"><span class="main-label">0</span><span class="shift-label">A</span><span class="super-label">.</span></button>
        <button class="virtual-key" data-code="ShiftLeft" style="left: 76px; top: 354px;"><span class="main-label">⇪</span><span class="shift-label"></span><span class="super-label"></span></button>
        <button class="virtual-key" data-code="ControlLeft" style="left: 145px; top: 354px;"><span class="main-label">Ⓢ</span><span class="shift-label"></span><span class="super-label"></span></button>
        <button class="virtual-key" data-code="Equal" style="left: 214px; top: 354px;"><span class="main-label">=</span><span class="shift-label">^</span><span class="super-label">🔆</span></button>
      </div>
    </div>

    <script type="module">
      import init, { start, key_down, key_up, tick } from './pkg/incredicalculator_web.js';

      // Frames are only rendered after input, or continuously while the
      // active app asks for realtime updates, to save battery.
      let frameScheduled = false;
      let ready = false;
      let frameCount = 0;
      const frameCounter = document.getElementById('frame-counter');

      const infoToggle = document.querySelector('.info-toggle');
      const infoPanel = document.getElementById('info-panel');
      infoToggle.addEventListener('click', () => {
        infoPanel.hidden = !infoPanel.hidden;
        infoToggle.setAttribute('aria-expanded', String(!infoPanel.hidden));
      });

      function requestFrame() {
        if (ready && !frameScheduled) {
          frameScheduled = true;
          requestAnimationFrame(frame);
        }
      }

      function frame() {
        frameScheduled = false;
        frameCount += 1;
        frameCounter.textContent = `frames: ${frameCount}`;
        if (tick()) {
          requestFrame();
        }
      }

      function dispatchKey(code, type) {
        if (type === 'keydown') {
          key_down(code);
        } else {
          key_up(code);
        }
        requestFrame();
      }

      document.querySelectorAll('.virtual-key').forEach((button) => {
        const code = button.dataset.code;

        const release = () => {
          button.classList.remove('pressed');
          dispatchKey(code, 'keyup');
        };

        button.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          button.classList.add('pressed');
          dispatchKey(code, 'keydown');
        });

        button.addEventListener('pointerup', release);
        button.addEventListener('pointerleave', release);
        button.addEventListener('pointercancel', release);
      });

      document.addEventListener('keydown', (event) => {
        if (event.code) {
          event.preventDefault();
          dispatchKey(event.code, 'keydown');
        }
      });

      document.addEventListener('keyup', (event) => {
        if (event.code) {
          event.preventDefault();
          dispatchKey(event.code, 'keyup');
        }
      });

      const shell = document.querySelector('.calculator-shell');
      const touchDevice = window.matchMedia('(pointer: coarse)');

      function fitShell() {
        if (!touchDevice.matches) {
          shell.style.removeProperty('--shell-scale');
          return;
        }
        const margin = 8;
        const scale = Math.min(
          (window.innerWidth - margin * 2) / shell.offsetWidth,
          (window.innerHeight - margin * 2) / shell.offsetHeight,
        );
        shell.style.setProperty('--shell-scale', scale);
      }

      fitShell();
      window.addEventListener('resize', fitShell);
      touchDevice.addEventListener('change', fitShell);

      await init();
      start();
      ready = true;
      requestFrame();
    </script>
  </body>
</html>
