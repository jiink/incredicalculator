<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incredicalculator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0b0b12;
        overflow: hidden;
      }
      .info-menu {
        position: fixed;
        top: 4px;
        left: 6px;
        display: flex;
        align-items: flex-start;
        gap: 6px;
        color: rgba(255, 255, 255, 0.6);
      }
      .info-toggle {
        padding: 0 4px;
        border: none;
        border-radius: 4px;
        background: none;
        color: inherit;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }
      .info-toggle:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .info-panel {
        font-size: 13px;
        line-height: 1.4;
        pointer-events: none;
      }
      #frame-counter {
        font: 12px monospace;
      }
      .info-panel button {
        display: block;
        margin-top: 4px;
        pointer-events: auto;
        cursor: pointer;
      }
      .info-menu {
        z-index: 2;
      }
      .scripts {
        margin-top: 10px;
      }
      .scripts-hint {
        font-size: 11px;
        opacity: 0.7;
      }
      #script-list {
        margin: 4px 0 0;
        padding: 0;
        list-style: none;
      }
      #script-list li {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #script-list li button {
        display: inline;
        margin: 0;
        padding: 0 5px;
      }
      #script-list .empty {
        font-style: italic;
        opacity: 0.7;
      }
      /* Author `display` rules beat the browser's own `[hidden]` style, so
         restate it for elements that set one. */
      [hidden] {
        display: none !important;
      }
      /* Shown while a file is dragged over the page */
      .drop-overlay {
        position: fixed;
        inset: 8px;
        z-index: 3;
        display: grid;
        place-items: center;
        border: 2px dashed rgba(255, 255, 255, 0.6);
        border-radius: 12px;
        background: rgba(11, 11, 18, 0.85);
        color: #fff;
        font-size: 20px;
        pointer-events: none;
      }
      .toast {
        position: fixed;
        bottom: 12px;
        left: 50%;
        z-index: 3;
        max-width: calc(100vw - 32px);
        padding: 6px 12px;
        border-radius: 6px;
        background: rgba(40, 40, 56, 0.95);
        color: #fff;
        font-size: 14px;
        transform: translateX(-50%);
      }
      .toast.error {
        background: rgba(120, 24, 24, 0.95);
      }
      /* Moved out of the (transformed) shell and sized by script so each
         canvas pixel covers exactly one screen pixel */
      canvas.pixel-perfect {
        position: fixed;
        z-index: 1;
        image-rendering: pixelated;
      }
      /* Scaled up by script on touch devices to fill the screen */
      .calculator-shell {
        transform: scale(var(--shell-scale, 1));
        transform-origin: center;
      }
      .calculator-shell {
        position: relative;
        width: 286px;
        height: 430px;
        padding: 0;
        background: rgba(209, 208, 208, 0.72);
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      }
      .display-slot {
        position: absolute;
        left: 34px;
        top: 20px;
        width: 160px;
        height: 120px;
        display: grid;
        place-items: center;
        background: #000;
        border-radius: 0;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 160px;
        height: 120px;
        image-rendering: auto;
        background: black;
      }
      .virtual-keypad {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .virtual-key {
        position: absolute;
        width: 64px;
        height: 64px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.92);
        background: rgba(0, 0, 0, 1.0);
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        user-select: none;
        touch-action: none;
        padding: 0;
      }
      .virtual-key .main-label,
      .virtual-key .shift-label,
      .virtual-key .super-label {
        position: absolute;
        line-height: 1;
        pointer-events: none;
      }
      .virtual-key .main-label {
        left: 8px;
        top: 8px;
        font-size: 1.5rem;
        color: #ffffff;
      }
      .virtual-key .shift-label {
        right: 7px;
        top: 8px;
        font-size: 0.75rem;
        color: #5b93fc;
      }
      .virtual-key .super-label {
        left: 7px;
        bottom: 8px;
        font-size: 0.7rem;
        color: #f18f3f;
      }
      .virtual-key:active,
      .virtual-key.pressed {
        background: rgba(111, 180, 255, 0.6);
        border-color: rgba(160, 210, 255, 0.9);
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div class="info-menu">
      <button class="info-toggle" aria-label="Show info" aria-expanded="false" aria-controls="info-panel">⋯</button>
      <div class="info-panel" id="info-panel" hidden>
        <div>Incredicalculator web simulator</div>
        <div id="frame-counter">frames: 0</div>
        <button id="pixel-perfect-toggle" aria-pressed="false">1:1 pixels</button>
        <button id="clear-settings">Clear settings</button>
        <div class="scripts">
          <div>Scripted apps</div>
          <div class="scripts-hint">Drop .lua files on the page to add or update them.</div>
          <ul id="script-list"></ul>
          <button id="add-script">Add script…</button>
          <input type="file" id="script-file" accept=".lua" multiple hidden />
        </div>
      </div>
    </div>
    <div class="drop-overlay" hidden>Drop .lua files to add them as apps</div>
    <div class="toast" role="status" hidden></div>
    <div class="calculator-shell">
      <div class="display-slot">
        <canvas id="incredicalculator" width="320" height="240"></canvas>
      </div>

      <div class="virtual-keypad" aria-label="Calculator keypad">
        <button class="virtual-key" data-code="Backspace" style="left: 214px; top: 9px;"></button>
        <button class="virtual-key" data-code="Slash" style="left: 214px; top: 78px;"></button>

        <button class="virtual-key" data-code="Digit7" style="left: 7px; top: 147px;"></button>
        <button class="virtual-key" data-code="Digit8" style="left: 76px; top: 147px;"></button>
        <button class="virtual-key" data-code="Digit9" style="left: 145px; top: 147px;"></button>
        <button class="virtual-key" data-code="NumpadMultiply" style="left: 214px; top: 147px;"></button>

        <button class="virtual-key" data-code="Digit4" style="left: 7px; top: 216px;"></button>
        <button class="virtual-key" data-code="Digit5" style="left: 76px; top: 216px;"></button>
        <button class="virtual-key" data-code="Digit6" style="left: 145px; top: 216px;"></button>
        <button class="virtual-key" data-code="Minus" style="left: 214px; top: 216px;"></button>

        <button class="virtual-key" data-code="Digit1" style="left: 7px; top: 285px;"></button>
        <button class="virtual-key" data-code="Digit2" style="left: 76px; top: 285px;"></button>
        <button class="virtual-key" data-code="Digit3" style="left: 145px; top: 285px;"></button>
        <button class="virtual-key" data-code="NumpadAdd" style="left: 214px; top: 285px;"></button>

        <button class="virtual-key" data-code="Digit0" style="left: 7px; top: 354px;"></button>
        <button class="virtual-key" data-code="ShiftLeft" style="left: 76px; top: 354px;"></button>
        <button class="virtual-key" data-code="ControlLeft" style="left: 145px; top: 354px;"></button>
        <button class="virtual-key" data-code="Equal" style="left: 214px; top: 354px;"></button>
      </div>
    </div>

    <script type="module">
      import init, {
        start, key_down, key_up, tick, fill_audio, has_active_audio, clear_settings,
        install_script, delete_script, installed_scripts, key_legends,
      } from './pkg/incredicalculator_web.js';

      // Frames are only rendered after input, or continuously while the
      // active app asks for realtime updates, to save battery.
      let frameScheduled = false;
      let ready = false;
      let frameCount = 0;
      const frameCounter = document.getElementById('frame-counter');

      const infoToggle = document.querySelector('.info-toggle');
      const infoPanel = document.getElementById('info-panel');
      infoToggle.addEventListener('click', () => {
        infoPanel.hidden = !infoPanel.hidden;
        infoToggle.setAttribute('aria-expanded', String(!infoPanel.hidden));
      });

      document.getElementById('clear-settings').addEventListener('click', () => {
        if (ready && confirm('Reset all settings to their defaults?')) {
          clear_settings();
          location.reload();
        }
      });

      // ---- Scripted apps ----
      const scriptList = document.getElementById('script-list');
      const scriptFile = document.getElementById('script-file');
      const dropOverlay = document.querySelector('.drop-overlay');
      const toast = document.querySelector('.toast');
      let toastTimer = null;

      function showToast(message, isError) {
        toast.textContent = message;
        toast.classList.toggle('error', isError);
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { toast.hidden = true; }, isError ? 6000 : 3000);
      }

      function refreshScriptList() {
        scriptList.replaceChildren();
        const names = installed_scripts();
        if (names.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'empty';
          empty.textContent = 'none installed';
          scriptList.append(empty);
        }
        for (const name of names) {
          const item = document.createElement('li');
          const remove = document.createElement('button');
          remove.textContent = '✕';
          remove.title = `Delete ${name}`;
          remove.setAttribute('aria-label', `Delete ${name}`);
          remove.addEventListener('click', () => {
            if (confirm(`Delete ${name}?`)) {
              delete_script(name);
              refreshScriptList();
              requestFrame();
            }
          });
          const label = document.createElement('span');
          label.textContent = name;
          item.append(remove, label);
          scriptList.append(item);
        }
      }

      async function installFiles(files) {
        if (!ready) {
          return;
        }
        const installed = [];
        for (const file of files) {
          try {
            installed.push(install_script(file.name, await file.text()));
          } catch (message) {
            showToast(String(message), true);
          }
        }
        if (installed.length > 0) {
          showToast(`Installed ${installed.join(', ')}. Find it in the apps menu.`, false);
          refreshScriptList();
          requestFrame();
        }
      }

      document.getElementById('add-script').addEventListener('click', () => scriptFile.click());
      scriptFile.addEventListener('change', () => {
        installFiles([...scriptFile.files]);
        scriptFile.value = '';
      });

      // Only react to drags that carry files, not text or links.
      const draggingFiles = (event) => event.dataTransfer?.types.includes('Files');
      let dragDepth = 0;
      document.addEventListener('dragenter', (event) => {
        if (draggingFiles(event)) {
          dragDepth += 1;
          dropOverlay.hidden = false;
        }
      });
      document.addEventListener('dragleave', (event) => {
        if (draggingFiles(event) && --dragDepth <= 0) {
          dragDepth = 0;
          dropOverlay.hidden = true;
        }
      });
      document.addEventListener('dragover', (event) => {
        if (draggingFiles(event)) {
          event.preventDefault();
          event.dataTransfer.dropEffect = 'copy';
        }
      });
      document.addEventListener('drop', (event) => {
        if (!draggingFiles(event)) {
          return;
        }
        event.preventDefault();
        dragDepth = 0;
        dropOverlay.hidden = true;
        installFiles([...event.dataTransfer.files]);
      });

      function requestFrame() {
        if (ready && !frameScheduled) {
          frameScheduled = true;
          requestAnimationFrame(frame);
        }
      }

      function frame() {
        frameScheduled = false;
        frameCount += 1;
        frameCounter.textContent = `frames: ${frameCount}`;
        if (tick()) {
          requestFrame();
        }
        // Notes start and stop during `tick`.
        updateAudio();
      }

      // Audio is pulled from the shell at 48 kHz mono, like the PC version.
      // The context is suspended whenever the synth is silent, like the RP
      // firmware stopping I2S, so idle pages don't run the audio callback.
      let audioCtx = null;

      function startAudio() {
        if (!ready) {
          return;
        }
        if (!audioCtx) {
          audioCtx = new AudioContext({ sampleRate: 48000 });
          // ScriptProcessorNode is deprecated, but runs on the main thread
          // where the wasm shell lives, which AudioWorklet does not.
          const node = audioCtx.createScriptProcessor(1024, 1, 1);
          node.onaudioprocess = (event) => {
            fill_audio(event.outputBuffer.getChannelData(0));
            // A pending frame may be about to start a note.
            if (!frameScheduled && !has_active_audio()) {
              audioCtx.suspend();
            }
          };
          node.connect(audioCtx.destination);
        }
        // Browsers only allow audio to start from a user gesture, so resume
        // from input handlers; `frame` suspends again if nothing plays.
        audioCtx.resume();
      }

      function updateAudio() {
        if (!audioCtx) {
          return;
        }
        if (has_active_audio()) {
          audioCtx.resume();
        } else if (audioCtx.state === 'running') {
          audioCtx.suspend();
        }
      }

      function dispatchKey(code, type) {
        if (type === 'keydown') {
          key_down(code);
        } else {
          key_up(code);
        }
        startAudio();
        requestFrame();
      }

      // Fills each keycap with its legends from the shared table in core.
      function labelKeys() {
        document.querySelectorAll('.virtual-key').forEach((button) => {
          const [main = '', shift = '', sup = ''] = key_legends(button.dataset.code);
          button.replaceChildren(
            ...[['main-label', main], ['shift-label', shift], ['super-label', sup]].map(
              ([className, text]) => {
                const span = document.createElement('span');
                span.className = className;
                span.textContent = text;
                return span;
              },
            ),
          );
        });
      }

      document.querySelectorAll('.virtual-key').forEach((button) => {
        const code = button.dataset.code;

        const release = () => {
          button.classList.remove('pressed');
          dispatchKey(code, 'keyup');
        };

        button.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          button.classList.add('pressed');
          dispatchKey(code, 'keydown');
        });

        button.addEventListener('pointerup', release);
        button.addEventListener('pointerleave', release);
        button.addEventListener('pointercancel', release);
      });

      document.addEventListener('keydown', (event) => {
        if (event.code) {
          event.preventDefault();
          dispatchKey(event.code, 'keydown');
        }
      });

      document.addEventListener('keyup', (event) => {
        if (event.code) {
          event.preventDefault();
          dispatchKey(event.code, 'keyup');
        }
      });

      const shell = document.querySelector('.calculator-shell');
      const touchDevice = window.matchMedia('(pointer: coarse)');

      function fitShell() {
        if (!touchDevice.matches) {
          shell.style.removeProperty('--shell-scale');
          return;
        }
        const margin = 8;
        const scale = Math.min(
          (window.innerWidth - margin * 2) / shell.offsetWidth,
          (window.innerHeight - margin * 2) / shell.offsetHeight,
        );
        shell.style.setProperty('--shell-scale', scale);
      }

      fitShell();
      window.addEventListener('resize', fitShell);
      touchDevice.addEventListener('change', fitShell);

      // 1:1 mode shows the canvas at its native resolution in device pixels,
      // centred over the display slot with its bottom edge on the slot's.
      const canvas = document.getElementById('incredicalculator');
      const displaySlot = document.querySelector('.display-slot');
      const pixelToggle = document.getElementById('pixel-perfect-toggle');
      let pixelPerfect = false;

      function layoutCanvas() {
        if (!pixelPerfect) {
          return;
        }
        const dpr = window.devicePixelRatio || 1;
        const slot = displaySlot.getBoundingClientRect();
        const width = canvas.width;
        const height = canvas.height;
        // Work in whole device pixels so the canvas lands on the pixel grid.
        const clamp = (value, max) => Math.min(Math.max(value, 0), Math.max(max, 0));
        const left = clamp(
          Math.round((slot.left + slot.width / 2) * dpr - width / 2),
          Math.floor(window.innerWidth * dpr) - width,
        );
        const top = clamp(
          Math.round(slot.bottom * dpr) - height,
          Math.floor(window.innerHeight * dpr) - height,
        );
        canvas.style.left = `${left / dpr}px`;
        canvas.style.top = `${top / dpr}px`;
        canvas.style.width = `${width / dpr}px`;
        canvas.style.height = `${height / dpr}px`;
      }

      // Zooming fires `resize`, but moving to a monitor with a different
      // scale may not, so also watch the current resolution.
      let resolutionQuery = null;
      function watchResolution() {
        resolutionQuery?.removeEventListener('change', onResolutionChange);
        resolutionQuery = window.matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
        resolutionQuery.addEventListener('change', onResolutionChange);
      }
      function onResolutionChange() {
        watchResolution();
        layoutCanvas();
      }
      watchResolution();

      pixelToggle.addEventListener('click', () => {
        pixelPerfect = !pixelPerfect;
        pixelToggle.setAttribute('aria-pressed', String(pixelPerfect));
        pixelToggle.textContent = pixelPerfect ? 'Fit to display' : '1:1 pixels';
        if (pixelPerfect) {
          // The shell's transform would make `position: fixed` relative to
          // it, and the slot clips overflow, so move the canvas to the body.
          document.body.appendChild(canvas);
          canvas.classList.add('pixel-perfect');
          layoutCanvas();
        } else {
          canvas.classList.remove('pixel-perfect');
          canvas.removeAttribute('style');
          displaySlot.appendChild(canvas);
        }
      });
      window.addEventListener('resize', layoutCanvas);

      await init();
      labelKeys();
      start();
      ready = true;
      refreshScriptList();
      requestFrame();
    </script>
  </body>
</html>
