<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incredicalculator</title>
    <!-- Material Design 3 styling from Beer CSS. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.min.css" />
    <link rel="stylesheet" href="shared/theme.css" />
    <style>
      :root {
        /* Beer's own list (Inter, Roboto, ..., Noto Sans) picks the italic
           face on systems that only have some styles of one of those fonts
           installed, so start with the system's own UI font instead. */
        --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
    </style>
  </head>
  <body class="dark">
    <main class="responsive">
      <section class="center-align" style="padding-block: 20vh">
        <h1 style="font-size: clamp(2.5rem, 10vw, 5.5rem); line-height: 1.1">Incredicalculator</h1>
        <p class="large-text">An open-source programmer calculator you can build, script, or run in your browser</p>
        <nav class="center-align wrap">
          <a class="button large" href="sim/"><i>calculate</i><span>Try the simulator</span></a>
          <a class="button large" href="editor/"><i>code</i><span>Write a script</span></a>
          <a class="button large border" href="https://github.com/jiink/incredicalculator"><i>commit</i><span>GitHub</span></a>
          <a class="button large border" href="https://oshwlab.com/jacob.j.carlson03/incredicalculatorpro"><i>memory</i><span>Hardware on OSHWLab</span></a>
        </nav>
      </section>
    </main>
  </body>
</html>
