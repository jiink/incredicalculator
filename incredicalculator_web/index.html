<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incredicalculator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b12;
      }
      .calculator-shell {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.04);
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      }
      canvas {
        display: block;
        width: 320px;
        height: 240px;
        image-rendering: pixelated;
        background: black;
        border-radius: 10px;
      }
      .virtual-keypad {
        position: relative;
        width: 280px;
        height: 430px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
      }
      .virtual-key {
        position: absolute;
        width: 64px;
        height: 64px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.92);
        background: rgba(255, 255, 255, 0.12);
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        user-select: none;
        touch-action: none;
      }
      .virtual-key:active,
      .virtual-key.pressed {
        background: rgba(111, 180, 255, 0.6);
        border-color: rgba(160, 210, 255, 0.9);
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div class="calculator-shell">
      <canvas id="incredicalculator" width="320" height="240"></canvas>

      <div class="virtual-keypad" aria-label="Calculator keypad">
        <button class="virtual-key" data-code="Backspace" style="left: 214px; top: 9px;">Bk</button>
        <button class="virtual-key" data-code="Slash" style="left: 214px; top: 78px;">/</button>

        <button class="virtual-key" data-code="Digit7" style="left: 7px; top: 147px;">7</button>
        <button class="virtual-key" data-code="Digit8" style="left: 76px; top: 147px;">8</button>
        <button class="virtual-key" data-code="Digit9" style="left: 145px; top: 147px;">9</button>
        <button class="virtual-key" data-code="NumpadMultiply" style="left: 214px; top: 147px;">*</button>

        <button class="virtual-key" data-code="Digit4" style="left: 7px; top: 216px;">4</button>
        <button class="virtual-key" data-code="Digit5" style="left: 76px; top: 216px;">5</button>
        <button class="virtual-key" data-code="Digit6" style="left: 145px; top: 216px;">6</button>
        <button class="virtual-key" data-code="Minus" style="left: 214px; top: 216px;">-</button>

        <button class="virtual-key" data-code="Digit1" style="left: 7px; top: 285px;">1</button>
        <button class="virtual-key" data-code="Digit2" style="left: 76px; top: 285px;">2</button>
        <button class="virtual-key" data-code="Digit3" style="left: 145px; top: 285px;">3</button>
        <button class="virtual-key" data-code="NumpadAdd" style="left: 214px; top: 285px;">+</button>

        <button class="virtual-key" data-code="Digit0" style="left: 7px; top: 354px;">0</button>
        <button class="virtual-key" data-code="ShiftLeft" style="left: 76px; top: 354px;">Shft</button>
        <button class="virtual-key" data-code="ControlLeft" style="left: 145px; top: 354px;">§</button>
        <button class="virtual-key" data-code="Equal" style="left: 214px; top: 354px;">=</button>
      </div>
    </div>

    <script type="module">
      import init, { start, key_down, key_up, tick } from './pkg/incredicalculator_web.js';

      function dispatchKey(code, type) {
        if (type === 'keydown') {
          key_down(code);
        } else {
          key_up(code);
        }
      }

      document.querySelectorAll('.virtual-key').forEach((button) => {
        const code = button.dataset.code;

        const release = () => {
          button.classList.remove('pressed');
          dispatchKey(code, 'keyup');
        };

        button.addEventListener('pointerdown', (event) => {
          event.preventDefault();
          button.classList.add('pressed');
          dispatchKey(code, 'keydown');
        });

        button.addEventListener('pointerup', release);
        button.addEventListener('pointerleave', release);
        button.addEventListener('pointercancel', release);
      });

      document.addEventListener('keydown', (event) => {
        if (event.code) {
          event.preventDefault();
          key_down(event.code);
        }
      });

      document.addEventListener('keyup', (event) => {
        if (event.code) {
          event.preventDefault();
          key_up(event.code);
        }
      });

      function frame() {
        tick();
        requestAnimationFrame(frame);
      }

      await init();
      start();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
