<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incredicalculator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0b12;
      }
      canvas {
        width: min(92vw, 640px);
        height: auto;
        image-rendering: pixelated;
        border: 2px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
        background: black;
      }
    </style>
  </head>
  <body>
    <canvas id="incredicalculator" width="320" height="240"></canvas>
    <script type="module">
      import init, { start } from './pkg/incredicalculator_web.js';
      await init();
      start();
    </script>
  </body>
</html>
