<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Incredicalculator simulator</title>
    <link rel="stylesheet" href="../shared/sim.css" />
    <!-- Material Design 3 styling from Beer CSS. The scoped build only
         styles what is inside a class="beer" element, so the calculator,
         which has its own look, is kept outside those. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/beercss@5.0.3/dist/cdn/beer.scoped.min.css" />
    <link rel="stylesheet" href="../shared/theme.css" />
    <style>
      :root {
        color-scheme: dark;
        /* Beer's own list (Inter, Roboto, ..., Noto Sans) picks the italic
           face on systems that only have some styles of one of those fonts
           installed, so start with the system's own UI font instead. */
        --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--surface);
        overflow: hidden;
      }
      .info-menu {
        position: fixed;
        top: 6px;
        left: 6px;
        z-index: 2;
        display: flex;
        align-items: flex-start;
        gap: 6px;
        background: none;
        overflow: visible;
      }
      .info-panel {
        width: 280px;
        max-height: calc(100dvh - 12px);
        overflow: auto;
        background: var(--surface-container);
      }
      #frame-counter {
        font-family: ui-monospace, monospace;
        color: var(--on-surface-variant);
      }
      .scripts-hint {
        color: var(--on-surface-variant);
      }
      #script-list {
        list-style: none;
      }
      #script-list li {
        display: flex;
        align-items: center;
        gap: 4px;
        min-height: 2.25rem;
      }
      #script-list .empty {
        color: var(--on-surface-variant);
      }
      /* Only there to give the snackbar Beer's styles; without a box of its
         own it takes no place in the page's grid. */
      .toast-host {
        display: contents;
      }
      /* Shown while a file is dragged over the page */
      .drop-overlay {
        position: fixed;
        inset: 8px;
        z-index: 3;
        display: grid;
        place-items: center;
        border: 2px dashed var(--on-surface-variant);
        border-radius: 16px;
        background: rgb(from var(--surface) r g b / 0.88);
        color: var(--on-surface);
        font: 20px sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="beer dark info-menu">
      <button class="circle transparent info-toggle" type="button" aria-label="Show menu" aria-expanded="false" aria-controls="info-panel"><i>more_horiz</i></button>
      <article class="info-panel border" id="info-panel" hidden>
        <h6 class="small">Incredicalculator simulator</h6>
        <nav class="wrap no-space">
          <a class="button small transparent" href="../"><i>home</i><span>Home</span></a>
          <a class="button small transparent" href="../editor/"><i>code</i><span>Script editor</span></a>
        </nav>
        <div id="frame-counter" class="small-text">frames: 0</div>
        <nav class="wrap">
          <button id="pixel-perfect-toggle" class="small border" type="button" aria-pressed="false"><i>grid_on</i><span>1:1 pixels</span></button>
          <button id="clear-settings" class="small border" type="button"><i>restart_alt</i><span>Clear settings</span></button>
        </nav>
        <hr />
        <h6 class="small">Scripted apps</h6>
        <p class="scripts-hint small-text">Drop .lua files on the page to add or update them.</p>
        <ul id="script-list"></ul>
        <button id="add-script" class="small" type="button"><i>add</i><span>Add script…</span></button>
        <input type="file" id="script-file" accept=".lua" multiple hidden />
      </article>
    </div>
    <div class="drop-overlay" hidden>Drop .lua files to add them as apps</div>
    <div class="beer dark toast-host">
      <div class="snackbar" id="toast" role="status"></div>
    </div>
    <main id="simulator"></main>

    <script type="module">
      import { mountSimulator } from '../shared/sim.js';

      const sim = await mountSimulator(document.getElementById('simulator'));
      const { wasm, requestFrame, shell, canvas, displaySlot } = sim;

      let frameCount = 0;
      const frameCounter = document.getElementById('frame-counter');
      sim.onFrame(() => {
        frameCount += 1;
        frameCounter.textContent = `frames: ${frameCount}`;
      });

      const infoToggle = document.querySelector('.info-toggle');
      const infoPanel = document.getElementById('info-panel');
      infoToggle.addEventListener('click', () => {
        infoPanel.hidden = !infoPanel.hidden;
        infoToggle.setAttribute('aria-expanded', String(!infoPanel.hidden));
      });

      document.getElementById('clear-settings').addEventListener('click', () => {
        if (confirm('Reset all settings to their defaults?')) {
          wasm.clear_settings();
          location.reload();
        }
      });

      // ---- Scripted apps ----
      const scriptList = document.getElementById('script-list');
      const scriptFile = document.getElementById('script-file');
      const dropOverlay = document.querySelector('.drop-overlay');
      const toast = document.getElementById('toast');
      let toastTimer = null;

      function showToast(message, isError) {
        toast.textContent = message;
        toast.classList.toggle('error', isError);
        toast.classList.add('active');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('active'), isError ? 6000 : 4000);
      }

      function refreshScriptList() {
        scriptList.replaceChildren();
        const names = wasm.installed_scripts();
        if (names.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'empty';
          empty.textContent = 'none installed';
          scriptList.append(empty);
        }
        for (const name of names) {
          const item = document.createElement('li');
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'circle small transparent';
          remove.innerHTML = '<i>delete</i>';
          remove.title = `Delete ${name}`;
          remove.setAttribute('aria-label', `Delete ${name}`);
          remove.addEventListener('click', () => {
            wasm.delete_script(name);
            refreshScriptList();
            requestFrame();
          });
          const label = document.createElement('span');
          label.textContent = name;
          item.append(remove, label);
          scriptList.append(item);
        }
      }

      async function installFiles(files) {
        const installed = [];
        for (const file of files) {
          try {
            installed.push(wasm.install_script(file.name, await file.text()));
          } catch (message) {
            showToast(String(message), true);
          }
        }
        if (installed.length > 0) {
          showToast(`Installed ${installed.join(', ')}. Find it in the apps menu.`, false);
          refreshScriptList();
          requestFrame();
        }
      }

      document.getElementById('add-script').addEventListener('click', () => scriptFile.click());
      scriptFile.addEventListener('change', () => {
        installFiles([...scriptFile.files]);
        scriptFile.value = '';
      });

      // Only react to drags that carry files, not text or links.
      const draggingFiles = (event) => event.dataTransfer?.types.includes('Files');
      let dragDepth = 0;
      document.addEventListener('dragenter', (event) => {
        if (draggingFiles(event)) {
          dragDepth += 1;
          dropOverlay.hidden = false;
        }
      });
      document.addEventListener('dragleave', (event) => {
        if (draggingFiles(event) && --dragDepth <= 0) {
          dragDepth = 0;
          dropOverlay.hidden = true;
        }
      });
      document.addEventListener('dragover', (event) => {
        if (draggingFiles(event)) {
          event.preventDefault();
          event.dataTransfer.dropEffect = 'copy';
        }
      });
      document.addEventListener('drop', (event) => {
        if (!draggingFiles(event)) {
          return;
        }
        event.preventDefault();
        dragDepth = 0;
        dropOverlay.hidden = true;
        installFiles([...event.dataTransfer.files]);
      });

      // ---- Fitting the screen ----
      const touchDevice = window.matchMedia('(pointer: coarse)');

      function fitShell() {
        if (!touchDevice.matches) {
          shell.style.removeProperty('--shell-scale');
          return;
        }
        const margin = 8;
        const scale = Math.min(
          (window.innerWidth - margin * 2) / shell.offsetWidth,
          (window.innerHeight - margin * 2) / shell.offsetHeight,
        );
        shell.style.setProperty('--shell-scale', scale);
      }

      fitShell();
      window.addEventListener('resize', fitShell);
      touchDevice.addEventListener('change', fitShell);

      // 1:1 mode shows the canvas at its native resolution in device pixels,
      // centred over the display slot with its bottom edge on the slot's.
      const pixelToggle = document.getElementById('pixel-perfect-toggle');
      let pixelPerfect = false;

      function layoutCanvas() {
        if (!pixelPerfect) {
          return;
        }
        const dpr = window.devicePixelRatio || 1;
        const slot = displaySlot.getBoundingClientRect();
        const width = canvas.width;
        const height = canvas.height;
        // Work in whole device pixels so the canvas lands on the pixel grid.
        const clamp = (value, max) => Math.min(Math.max(value, 0), Math.max(max, 0));
        const left = clamp(
          Math.round((slot.left + slot.width / 2) * dpr - width / 2),
          Math.floor(window.innerWidth * dpr) - width,
        );
        const top = clamp(
          Math.round(slot.bottom * dpr) - height,
          Math.floor(window.innerHeight * dpr) - height,
        );
        canvas.style.left = `${left / dpr}px`;
        canvas.style.top = `${top / dpr}px`;
        canvas.style.width = `${width / dpr}px`;
        canvas.style.height = `${height / dpr}px`;
      }

      // Zooming fires `resize`, but moving to a monitor with a different
      // scale may not, so also watch the current resolution.
      let resolutionQuery = null;
      function watchResolution() {
        resolutionQuery?.removeEventListener('change', onResolutionChange);
        resolutionQuery = window.matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
        resolutionQuery.addEventListener('change', onResolutionChange);
      }
      function onResolutionChange() {
        watchResolution();
        layoutCanvas();
      }
      watchResolution();

      pixelToggle.addEventListener('click', () => {
        pixelPerfect = !pixelPerfect;
        pixelToggle.setAttribute('aria-pressed', String(pixelPerfect));
        pixelToggle.querySelector('span').textContent = pixelPerfect ? 'Fit to display' : '1:1 pixels';
        pixelToggle.querySelector('i').textContent = pixelPerfect ? 'fit_screen' : 'grid_on';
        if (pixelPerfect) {
          // The shell's transform would make `position: fixed` relative to
          // it, and the slot clips overflow, so move the canvas to the body.
          document.body.appendChild(canvas);
          canvas.classList.add('pixel-perfect');
          layoutCanvas();
        } else {
          canvas.classList.remove('pixel-perfect');
          canvas.removeAttribute('style');
          displaySlot.appendChild(canvas);
        }
      });
      window.addEventListener('resize', layoutCanvas);

      refreshScriptList();
    </script>
  </body>
</html>
