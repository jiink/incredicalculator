[workspace]
resolver = "2"
members = [
    "crates/bitwise_expr",
    "crates/flash_disk",
    "crates/incredicalculator_core",
    "crates/exp-rs-patched",
    "crates/tsuki-patched",
    "incredicalculator_pc",
    "incredicalculator_rp",
    "incredicalculator_web",
]

[patch.crates-io]
exp-rs = { path = "crates/exp-rs-patched" }
tsuki = { path = "crates/tsuki-patched" }

[profile.bench]
opt-level = 0
lto = false
codegen-units = 16
debug = 2

[profile.dev]
opt-level = 2
lto = true
codegen-units = 1
debug = 2
panic = "abort"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 2
panic = "abort"
